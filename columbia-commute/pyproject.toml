[project]
name = "lion-line"
version = "0.1.0"
description = "Lion Line: a Columbia commute agent (FastAPI + LiteLLM + Gemini) with live MTA, walking and weather tools"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
    "gtfs-realtime-bindings>=1.0.0",
]
